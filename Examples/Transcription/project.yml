name: Transcription

options:
  bundleIdPrefix: com.technoplato.InstantSwiftData
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  InstantSwiftData:
    path: ../..

targets:
  TranscriptioniOS:
    type: application
    platform: iOS
    sources:
      - path: ../../Sources/TranscriptionExecutable/main.swift
    dependencies:
      - package: InstantSwiftData
        product: TranscriptionApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.technoplato.InstantSwiftData.TranscriptioniOS
        PRODUCT_NAME: Transcription
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOS-Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"

  TranscriptionmacOS:
    type: application
    platform: macOS
    sources:
      - path: ../../Sources/TranscriptionExecutable/main.swift
    dependencies:
      - package: InstantSwiftData
        product: TranscriptionApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.technoplato.InstantSwiftData.TranscriptionmacOS
        PRODUCT_NAME: Transcription
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: macOS-Info.plist
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
