name: RemindersV3

options:
  bundleIdPrefix: com.technoplato.InstantSwiftData
  deploymentTarget:
    iOS: "17.0"

packages:
  InstantSwiftData:
    path: ../..

targets:
  RemindersV3iOS:
    type: application
    platform: iOS
    sources:
      - path: ../../Sources/RemindersV3Executable/main.swift
    dependencies:
      - package: InstantSwiftData
        product: InstantSwiftData
      - package: InstantSwiftData
        product: RemindersV3App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.technoplato.InstantSwiftData.RemindersV3iOS
        PRODUCT_NAME: Reminders V3
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
