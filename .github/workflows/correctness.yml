name: Correctness

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-and-typescript:
    name: Swift + TypeScript contracts
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: validation/ts-runner/pnpm-lock.yaml

      - name: Enable pinned pnpm
        run: corepack enable

      - name: Install TypeScript contract dependencies
        run: corepack pnpm --dir validation/ts-runner install --frozen-lockfile

      - name: Swift release tests
        run: swift test -c release

      - name: Macro tests
        env:
          INSTANT_SWIFT_DATA_MACRO_TESTING_JOBS: 1
        run: bash validation/run-macro-tests.sh

      - name: TypeScript compatibility matrix
        run: corepack pnpm --dir validation/ts-runner test

      - name: Verify generated contract is clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
